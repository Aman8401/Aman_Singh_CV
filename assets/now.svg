<svg xmlns="http://www.w3.org/2000/svg" width="600" height="364" viewBox="0 0 600 364" role="img" aria-label="Currently working on: Call Karigar refactor, DLC Shree production, SHRAM Worker App, Crop Loss Web API migration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Currently working on</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1C33"/><stop offset="1" stop-color="#0A1222"/></linearGradient>
    <pattern id="stripe" width="16" height="10" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
      <rect width="8" height="10" fill="#fff" fill-opacity="0.22"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="16 0" dur="0.8s" repeatCount="indefinite" additive="sum"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="364" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .row { animation: in .7s cubic-bezier(.2,.8,.2,1) both; }
      .r2 { animation-delay: .15s } .r3 { animation-delay: .3s } .r4 { animation-delay: .45s }
      @keyframes in { from { opacity: 0; transform: translateX(-16px) } to { opacity: 1; transform: translateX(0) } }
      .fill { transform-box: fill-box; transform-origin: left; animation: fill 4s ease-in-out infinite; }
      .f2 { animation-delay: -1s } .f3 { animation-delay: -2s } .f4 { animation-delay: -3s }
      @keyframes fill { 0% { transform: scaleX(.15) } 50% { transform: scaleX(1) } 100% { transform: scaleX(.15) } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="364" fill="url(#bg)"/>
    <rect width="600" height="44" fill="#0B1424"/>
    <circle cx="24" cy="22" r="6" fill="#FF5F57"/><circle cx="44" cy="22" r="6" fill="#FEBC2E"/><circle cx="64" cy="22" r="6" fill="#28C840"/>
    <text x="300" y="27" text-anchor="middle" class="mono" font-size="13" fill="#7D8A9C">currently_building.dart</text>
    <text x="24" y="76" class="mono" font-size="13" fill="#13B9FD">$ flutter run --now<tspan class="blink" fill="#E6EDF3"> ▋</tspan></text>

    <g transform="translate(24,112)"><g class="row">
      <text class="sans" font-size="16" font-weight="700" fill="#F0F6FC">Call Karigar</text>
      <text x="552" text-anchor="end" class="mono" font-size="12" fill="#13B9FD">refactoring</text>
      <text y="20" class="sans" font-size="13" fill="#8B98A9">Cleaner structure, easier-to-maintain codebase</text>
      <rect y="30" width="552" height="8" rx="4" fill="#1C2A40"/>
      <g class="fill"><rect y="30" width="552" height="8" rx="4" fill="#13B9FD"/><rect y="30" width="552" height="8" rx="4" fill="url(#stripe)"/></g>
    </g></g>
    <g transform="translate(24,176)"><g class="row r2">
      <text class="sans" font-size="16" font-weight="700" fill="#F0F6FC">Digital Labour Chowk</text>
      <text x="552" text-anchor="end" class="mono" font-size="12" fill="#2EA043">● live</text>
      <text y="20" class="sans" font-size="13" fill="#8B98A9">Production support with safe, reversible changes</text>
      <rect y="30" width="552" height="8" rx="4" fill="#1C2A40"/>
      <g class="fill f2"><rect y="30" width="552" height="8" rx="4" fill="#2EA043"/><rect y="30" width="552" height="8" rx="4" fill="url(#stripe)"/></g>
    </g></g>
    <g transform="translate(24,240)"><g class="row r3">
      <text class="sans" font-size="16" font-weight="700" fill="#F0F6FC">SHRAM Worker App</text>
      <text x="552" text-anchor="end" class="mono" font-size="12" fill="#A98BFF">building</text>
      <text y="20" class="sans" font-size="13" fill="#8B98A9">18 screens on a strict MVVM architecture</text>
      <rect y="30" width="552" height="8" rx="4" fill="#1C2A40"/>
      <g class="fill f3"><rect y="30" width="552" height="8" rx="4" fill="#7C4DFF"/><rect y="30" width="552" height="8" rx="4" fill="url(#stripe)"/></g>
    </g></g>
    <g transform="translate(24,304)"><g class="row r4">
      <text class="sans" font-size="16" font-weight="700" fill="#F0F6FC">Crop Loss</text>
      <text x="552" text-anchor="end" class="mono" font-size="12" fill="#FFCA28">migrating</text>
      <text y="20" class="sans" font-size="13" fill="#8B98A9">Moving from legacy WCF to the new Web API</text>
      <rect y="30" width="552" height="8" rx="4" fill="#1C2A40"/>
      <g class="fill f4"><rect y="30" width="552" height="8" rx="4" fill="#F5A524"/><rect y="30" width="552" height="8" rx="4" fill="url(#stripe)"/></g>
    </g></g>
  </g>
  <rect x="0.75" y="0.75" width="598.5" height="362.5" rx="18" fill="none" stroke="#13B9FD" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
