<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="8+ government apps, 2.5+ years experience, 29+2 state logins in Naksha, 3 platforms" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Highlights</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1C33"/>
      <stop offset="1" stop-color="#0A1222"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9BE3FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="numA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#13B9FD"/></linearGradient>
    <clipPath id="c1"><rect x="0" y="0" width="282" height="160" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .t { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }
      .t2 { animation-delay: .15s } .t3 { animation-delay: .3s } .t4 { animation-delay: .45s }
      @keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-320px) } 60%,100% { transform: translateX(340px) } }
      .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.4s .6s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { stroke-opacity: .25 } 50% { stroke-opacity: .7 } }
    </style>
  </defs>

  <!-- tile 1 -->
  <g transform="translate(4,5)"><g class="t">
    <rect width="282" height="160" rx="18" fill="url(#tile)" stroke="#13B9FD" class="glow"/>
    <g clip-path="url(#c1)"><rect class="sweep" x="0" y="0" width="160" height="160" fill="url(#shine)"/></g>
    <text x="28" y="40" class="mono" font-size="12" fill="#13B9FD" letter-spacing="2">SHIPPED</text>
    <text x="26" y="96" class="sans" font-size="50" font-weight="800" fill="url(#numA)">8+</text>
    <text x="28" y="126" class="sans" font-size="15" fill="#A9B4C2">Government apps built</text>
    <rect class="bar" x="28" y="140" width="120" height="4" rx="2" fill="#13B9FD"/>
  </g></g>

  <!-- tile 2 -->
  <g transform="translate(306,5)"><g class="t t2">
    <rect width="282" height="160" rx="18" fill="url(#tile)" stroke="#7C4DFF" class="glow"/>
    <g clip-path="url(#c1)"><rect class="sweep" x="0" y="0" width="160" height="160" fill="url(#shine)" style="animation-delay:.6s"/></g>
    <text x="28" y="40" class="mono" font-size="12" fill="#A98BFF" letter-spacing="2">EXPERIENCE</text>
    <text x="26" y="96" class="sans" font-size="50" font-weight="800" fill="#FFFFFF">2.5<tspan fill="#A98BFF">+</tspan></text>
    <text x="28" y="126" class="sans" font-size="15" fill="#A9B4C2">Years on production apps</text>
    <rect class="bar" x="28" y="140" width="150" height="4" rx="2" fill="#7C4DFF"/>
  </g></g>

  <!-- tile 3 -->
  <g transform="translate(608,5)"><g class="t t3">
    <rect width="282" height="160" rx="18" fill="url(#tile)" stroke="#2EA043" class="glow"/>
    <g clip-path="url(#c1)"><rect class="sweep" x="0" y="0" width="160" height="160" fill="url(#shine)" style="animation-delay:1.2s"/></g>
    <text x="28" y="40" class="mono" font-size="12" fill="#4FD17A" letter-spacing="2">NAKSHA · GOI</text>
    <text x="26" y="96" class="sans" font-size="50" font-weight="800" fill="#FFFFFF">29<tspan fill="#4FD17A" font-size="36"> + 2</tspan></text>
    <text x="28" y="126" class="sans" font-size="15" fill="#A9B4C2">State logins handled</text>
    <rect class="bar" x="28" y="140" width="180" height="4" rx="2" fill="#2EA043"/>
  </g></g>

  <!-- tile 4 -->
  <g transform="translate(910,5)"><g class="t t4">
    <rect width="282" height="160" rx="18" fill="url(#tile)" stroke="#F5A524" class="glow"/>
    <g clip-path="url(#c1)"><rect class="sweep" x="0" y="0" width="160" height="160" fill="url(#shine)" style="animation-delay:1.8s"/></g>
    <text x="28" y="40" class="mono" font-size="12" fill="#FFCA28" letter-spacing="2">PLATFORMS</text>
    <text x="26" y="96" class="sans" font-size="50" font-weight="800" fill="#FFFFFF">3</text>
    <text x="70" y="78" class="mono" font-size="12" fill="#FFE9B0">Android</text>
    <text x="70" y="94" class="mono" font-size="12" fill="#FFE9B0">iOS · Web</text>
    <text x="28" y="126" class="sans" font-size="15" fill="#A9B4C2">Platforms I ship to</text>
    <rect class="bar" x="28" y="140" width="90" height="4" rx="2" fill="#F5A524"/>
  </g></g>
</svg>
